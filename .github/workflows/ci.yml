name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm --filter cms test:int
        env:
          PAYLOAD_SECRET: ci-test-secret

      # A Payload/plugin upgrade can change the schema; `payload migrate` only
      # applies committed files, so an uncommitted diff would silently ship.
      - name: Check for missing migrations
        working-directory: apps/cms
        run: |
          pnpm payload migrate:create ci_schema_check --skip-empty
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            git status --porcelain src/migrations
            echo "::error::Schema changed without a migration. Run 'pnpm payload migrate:create <name>' in apps/cms and commit the result."
            exit 1
          fi
        env:
          PAYLOAD_SECRET: ci-test-secret
          DATABASE_URL: file:${{ runner.temp }}/migration-check.db
          MEDIA_PUBLIC_URL: https://media.test
          # Disables the dev-only schema push in payload.config.ts.
          NODE_ENV: production

  # A passing `opennextjs-cloudflare build` doesn't mean the Worker boots:
  # next 16.4.0 with an older OpenNext built fine but 500'd on every request.
  # Next/OpenNext bumps must go red here instead of in production.
  cms-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Worker
        working-directory: apps/cms
        run: pnpm run build:cf
        env:
          PAYLOAD_SECRET: ci-test-secret
          DATABASE_URL: file:${{ runner.temp }}/smoke.db
          MEDIA_PUBLIC_URL: https://media.test

      - name: Boot Worker and probe
        working-directory: apps/cms
        run: pnpm run smoke
